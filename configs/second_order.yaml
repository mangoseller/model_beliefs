# Second-order belief experiment (see README.md and docs/IMPLEMENTATION_NOTES.md).
# Every run reads this file. Values marked DECISION are project choices that
# may still change; the value shown is the current one.

seed: 20261111             # base seed for local sampling, fits and bootstraps

# Fields withheld from the agent's copy in the partial-evidence setting (pair S4). The
# Phase 1 pilot (second_order/deprecated/pilot.py) chose S4 from these candidate sets.
withheld_set: S4
withheld_sets:
  H: [hypertension_self_reported]                           # single-field rung; matched against the flip
  S1: [diabetes_self_reported, hypertension_self_reported]
  S2: [ridageyr]
  S3: [diabetes_self_reported, hypertension_self_reported, cvd_any]
  S4: [ridageyr, diabetes_self_reported, hypertension_self_reported]

# Layout of the prompts about the agent: "plan" = profile first, then the agent
# paragraph, then the redirected question and the answer format.
# "repo" = the first-order order (question, format, options, profile) with
# the agent paragraph after the profile.
layout: plan               # DECISION

# Layout of the own-belief prompts (A and every B). "matched" = the layout and
# ending of the prompts about the agent (profile first, then the question and the
# answer format), so A and B end with the same suffix as C, M and D. "first_order"
# = the released first-order prompt. Models whose A comes from the release always
# use first_order, so their B prompts match their A prompts.
self_layout: matched

# Framing of the agent's evidence in C_F, M_F and D_F. "reported": a colleague read
# the agent the profile (in C_F getting one line wrong), so M_F and D_F share one
# template. "copy": the agent reviewed an earlier copy (the earlier build; no D_F).
false_belief_framing: reported

# False-belief pair F: this field is shown with the opposite Yes/No value.
flip_field: hypertension_self_reported

# How withheld fields appear in the agent's copy (B and M profiles):
# "not_recorded" keeps the line with the value "Not recorded" and C says the
# agent's copy listed it that way; "removed" drops the line.
missing_fields: not_recorded

# Conditions are defined in second_order/conditions.py. `schedule` is the set a
# model runs unless its entry lists its own `conditions`, plus the extras for some models.
schedule:
  default: [A, B, C_john, D_john, M_S4, B_F, C_F, M_F, B_H, C_H, M_H]
  # The S1 ladder rung and the user framing ran on three models only (earlier design).
  extra: [B_S1, C_S1, C_user, D_user]
  extra_models: [gemma3_12b, deepseek_v32, openai_terra]

# Curse-of-knowledge experiment (docs/IMPLEMENTATION_NOTES.md): the leakage rate
# lambda in a partial-evidence and a false-belief setting, on CKD (latent and
# direct beliefs) and the bespoke dataset (direct beliefs only).
experiment:
  models: [qwen3_8b, qwen3_14b]
  # partial evidence: A B C_john M_S4 D_john; false belief: B_F C_F M_F D_F (conditions.SETTINGS)
  conditions: &curse [A, B, C_john, M_S4, D_john, B_F, C_F, M_F, D_F]
  replicates: {A: 2, B: 2, B_F: 2}        # runs of the own-belief conditions; the second gives rho
  comprehension:
    conditions: [C_john, C_F]             # a follow-up turn after each of these answers
    outputs: [probability]                # CKD: after the numeric probability only
  camerer_w: 0.51                         # Camerer, Loewenstein and Weber (1989)

# Before the main run, the runner's tune stage times these vLLM engine settings on a
# sample of real calls, keeps the fastest (written into the run's config as the model's
# `engine` and `batch_size`) and stops the run if the answers do not parse.
tuning:
  items: 1024                 # benchmark calls per configuration
  min_parse_rate: 0.8
  max_truncated_rate: 0.1
  bespoke_share: 0.1
  candidates:
    - {max_num_seqs: 256, max_num_batched_tokens: 8192, gpu_memory_utilization: 0.92, enable_prefix_caching: true}
    - {max_num_seqs: 512, max_num_batched_tokens: 16384, gpu_memory_utilization: 0.92, enable_prefix_caching: true}
    - {max_num_seqs: 1024, max_num_batched_tokens: 32768, gpu_memory_utilization: 0.92, enable_prefix_caching: true}

# Residual-stream activations frozen after generation (second_order/freeze.py): which outputs.
activations:
  outputs: {ckd: [probability], bespoke: [probability]}
  samples: 1
  replicates: [0]

bespoke:
  items: data/bespoke/items.yaml          # local item file (schema: docs/BESPOKE.md); SO_BESPOKE_ITEMS overrides
  samples: 20                             # samples per item, condition and run

# Generation backends. Models with cached_a take condition A from the released
# first-order responses; the others generate it themselves.
models:
  # The paper's nine hosted models (the earlier RQ1-RQ3 design).
  gemma3_4b:     {backend: bedrock, model_id: google.gemma-3-4b-it, cached_a: true}
  gemma3_12b:    {backend: bedrock, model_id: google.gemma-3-12b-it, cached_a: true}
  llama31_70b:   {backend: bedrock, model_id: us.meta.llama3-1-70b-instruct-v1:0, cached_a: true}
  gemma3_27b:    {backend: bedrock, model_id: google.gemma-3-27b-it, cached_a: true}
  qwen3_32b:     {backend: bedrock, model_id: qwen.qwen3-32b-v1:0, cached_a: true}
  deepseek_v32:  {backend: bedrock, model_id: deepseek.v3.2, cached_a: true}
  glm5:          {backend: bedrock, model_id: zai.glm-5, cached_a: true}
  openai_luna:   {backend: openai, model_id: gpt-5.6-luna, cached_a: true, reasoning_effort: medium}
  openai_terra:  {backend: openai, model_id: gpt-5.6-terra, cached_a: true, reasoning_effort: medium}
  # Local 4-bit MLX checkpoints for Apple silicon (not the hosted weights); splits are
  # borrowed from the hosted model of the same size (earlier design).
  gemma3_4b_mlx:  {backend: mlx, path: build/activation_pilot/model, cached_a: false, split_from: gemma3_4b, batch_size: 12}
  gemma3_12b_mlx: {backend: mlx, path: build/activation_pilot_12b/model, cached_a: false, split_from: gemma3_12b, batch_size: 8}
  # Curse-of-knowledge models: local open weights on a CUDA machine (vLLM), thinking off.
  qwen3_8b:  {backend: vllm, path: Qwen/Qwen3-8B, cached_a: false, split: own, datasets: [ckd, bespoke],
              conditions: *curse, dtype: bfloat16, enable_thinking: false, max_model_len: 16384, batch_size: 1024}
  qwen3_14b: {backend: vllm, path: Qwen/Qwen3-14B, cached_a: false, split: own, datasets: [ckd, bespoke],
              conditions: *curse, dtype: bfloat16, enable_thinking: false, max_model_len: 16384, batch_size: 1024}
  # Transformers fallback and a CPU-sized smoke model for the chat template and parsing path.
  qwen3_8b_hf:   {backend: hf, path: Qwen/Qwen3-8B, cached_a: false, split: own, datasets: [ckd, bespoke],
                  conditions: *curse, dtype: bfloat16, enable_thinking: false, batch_size: 16}
  qwen3_0_6b_hf: {backend: hf, path: Qwen/Qwen3-0.6B, cached_a: false, split: own, datasets: [ckd, bespoke],
                  conditions: *curse, dtype: float32, enable_thinking: false, batch_size: 4}
  # Text-level simulator with known parameters (second_order/synthetic.py), for end-to-end checks.
  synthetic: {backend: synthetic, cached_a: false, split: own, datasets: [ckd, bespoke], conditions: *curse,
              batch_size: 100000,
              truth: {lambda_partial: 0.5, lambda_false: 0.3, phi: 0.8, intercept: 0.2, call_noise: 0.35,
                      comprehension_accuracy: 0.9}}
  # Activation replay for the hosted models' open weights on a CUDA machine
  # (second_order/deprecated/activations.py; earlier design).
  gemma3_27b_hf:  {backend: hf, path: google/gemma-3-27b-it, cached_a: false, split_from: gemma3_27b, dtype: bfloat16}
  qwen3_32b_hf:   {backend: hf, path: Qwen/Qwen3-32B, cached_a: false, split_from: qwen3_32b, dtype: bfloat16}
  llama31_70b_hf: {backend: hf, path: meta-llama/Llama-3.1-70B-Instruct, cached_a: false, split_from: llama31_70b, dtype: bfloat16}

# Cases in the main run.
main_cases: all            # DECISION: all 500, or an integer

# Earlier design: the Phase 1 pilot (second_order/deprecated/pilot.py) and the CKD
# case set that `--smoke` selects in run_generation and phase3.
pilot:
  models: [openai_terra, qwen3_32b]   # one strong and one mid-range hosted model
  local_models: [gemma3_4b_mlx]
  n_cases: 50
  samples: 3

smoke:
  model: gemma3_4b_mlx
  n_cases: 24

generation:
  temperature: 1.0
  max_tokens: 4096

budget:
  approval_threshold_calls: 1000
  # USD per million tokens (input, output). DECISION: fill in current prices;
  # with nulls, the estimate is reported in tokens only.
  prices:
    bedrock: {input: null, output: null}
    openai: {input: null, output: null}
  # Mean tokens per call, from the condition A cache (docs/ORIENTATION.md);
  # second-order prompts add about 80 input tokens.
  extra_input_tokens: 80

analysis:
  bootstrap_resamples: 2000
  capability_floor: 0.65   # DECISION
  disagreements_per_model: 20
  transcripts_per_condition: 20

