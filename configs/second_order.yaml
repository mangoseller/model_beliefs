# Second-order belief experiment (see the build plan and docs/ORIENTATION.md).
# Every run reads this file. Values marked DECISION are choices for Sam; the
# value shown is the default used until he says otherwise.

domain: ckd
seed: 20261111             # base seed for local sampling, fits and bootstraps
replicate: 0               # 0 = main run; 1 = B' (deferred)

# Phase 1 picks this set. The candidate sets are the plan's S1-S4.
withheld_set: S4           # DECISION (pilot evidence: results/pilot/)
withheld_sets:
  S1: [diabetes_self_reported, hypertension_self_reported]
  S2: [ridageyr]
  S3: [diabetes_self_reported, hypertension_self_reported, cvd_any]
  S4: [ridageyr, diabetes_self_reported, hypertension_self_reported]

# Layout of the C/D prompts: "plan" = profile first, then the agent paragraph,
# then the redirected question and answer format (the plan's template).
# "repo" = the first-order order (question, format, options, profile) with
# the agent paragraph after the profile.
layout: plan               # DECISION

agent_name: John

conditions: [A, B, C_john, D_john, C_user, D_user]
e_conditions: [E_self, E_weak, E_strong]

# Generation backends. "hosted" models already have condition A in the release
# cache; local models regenerate condition A themselves.
models:
  gemma3_4b:     {backend: bedrock, model_id: google.gemma-3-4b-it, cached_a: true}
  gemma3_12b:    {backend: bedrock, model_id: google.gemma-3-12b-it, cached_a: true}
  llama31_70b:   {backend: bedrock, model_id: us.meta.llama3-1-70b-instruct-v1:0, cached_a: true}
  gemma3_27b:    {backend: bedrock, model_id: google.gemma-3-27b-it, cached_a: true}
  qwen3_32b:     {backend: bedrock, model_id: qwen.qwen3-32b-v1:0, cached_a: true}
  deepseek_v32:  {backend: bedrock, model_id: deepseek.v3.2, cached_a: true}
  glm5:          {backend: bedrock, model_id: zai.glm-5, cached_a: true}
  openai_luna:   {backend: openai, model_id: gpt-5.6-luna, cached_a: true, reasoning_effort: medium}
  openai_terra:  {backend: openai, model_id: gpt-5.6-terra, cached_a: true, reasoning_effort: medium}
  # Local 4-bit MLX checkpoints (not the hosted weights). Splits are borrowed
  # from the hosted model of the same size.
  gemma3_4b_mlx:  {backend: mlx, path: build/activation_pilot/model, cached_a: false, split_from: gemma3_4b, batch_size: 12}
  gemma3_12b_mlx: {backend: mlx, path: build/activation_pilot_12b/model, cached_a: false, split_from: gemma3_12b, batch_size: 8}
  # Activation-only checkpoints for a GPU instance (Phase 4 beyond this Mac);
  # weights must match the hosted model as closely as possible.
  gemma3_27b_hf:  {backend: hf, path: google/gemma-3-27b-it, cached_a: false, split_from: gemma3_27b, dtype: bfloat16}
  qwen3_32b_hf:   {backend: hf, path: Qwen/Qwen3-32B, cached_a: false, split_from: qwen3_32b, dtype: bfloat16}
  llama31_70b_hf: {backend: hf, path: meta-llama/Llama-3.1-70B-Instruct, cached_a: false, split_from: llama31_70b, dtype: bfloat16}

# Models in the main run (default: every model with cached condition A).
main_models: [gemma3_4b, gemma3_12b, llama31_70b, gemma3_27b, qwen3_32b, deepseek_v32, glm5, openai_luna, openai_terra]  # DECISION
main_cases: all            # DECISION: all 500, or an integer

pilot:
  models: [openai_terra, qwen3_32b]   # DECISION: plan says one strong, one mid-range
  local_models: [gemma3_4b_mlx]       # what ran on this machine
  n_cases: 50
  samples: 3

smoke:
  model: gemma3_4b_mlx
  n_cases: 24

generation:
  temperature: 1.0
  max_tokens: 4096

budget:
  approval_threshold_calls: 1000
  # USD per million tokens (input, output). DECISION: fill in current prices;
  # with nulls, the estimate is reported in tokens only.
  prices:
    bedrock: {input: null, output: null}
    openai: {input: null, output: null}
  # Mean tokens per call, from the condition A cache (docs/ORIENTATION.md);
  # second-order prompts add about 80 input tokens.
  extra_input_tokens: 80

analysis:
  bootstrap_resamples: 2000
  capability_floor: 0.65   # DECISION
  disagreements_per_model: 20
  transcripts_per_condition: 20

phase6:
  n_cases: 200
  weak_model: gemma3_4b
  strong_model: openai_terra
