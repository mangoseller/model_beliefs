# Exact environment used to verify the replication (macOS arm64 / osx-arm64).
# It reproduces the paper's plotted values exactly up to the few last-bit and
# tie-breaking differences listed under "Exactness" in archive/smolin_wilder_replication/README.md.
#
# Why the exact builds matter: concordance indices count tied predictions as
# half-concordant, and some held-out predictions are tied up to floating-point
# rounding.  pandas' default CSV float parser is not correctly rounded and its
# last-bit behaviour differs between the Anaconda build pinned here and the
# PyPI wheel of the same version, which flips a few ties and moves individual
# c-indices by up to ~0.01.  Likewise, the CKD case-sampling risk scores are
# XGBoost cross-validated predictions.  On other platforms, use the same
# versions; expect identical results except for tie-sensitive concordance
# values in the third decimal place.
name: latent-beliefs
channels:
  - defaults
dependencies:
  - python=3.11.7
  - numpy=1.26.3=py311he598dae_0
  - pandas=2.1.4=py311h7aedaa7_0
  - bottleneck=1.3.5  # optional pandas accelerators, present in the
  - numexpr=2.8.7     # environment that produced the paper's results
  - scipy=1.11.4=py311hc76d9b0_0  # scikit-learn dependency
  - py-xgboost=1.7.3=py311hca03da5_0
  - requests=2.32.3
  - pip
  - pip:
      - torch==2.6.0
      - matplotlib==3.7.5
      - scikit-learn==1.7.1
      # LLM collection and data download only.
      - boto3==1.43.42
      - kagglehub==0.3.13
