[project]
name = "model_beliefs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "numpy",
    "scipy",
    "peft",
]

[project.optional-dependencies]
# second_order/ and the latent_beliefs replication package; run_experiment.sh installs the pinned
# versions from requirements/ (experiment.txt, and gpu.txt for vLLM).
second-order = [
    "pandas",
    "pyyaml",
    "pyarrow",
    "scikit-learn",
    "matplotlib",
    "xgboost",
    "requests",
    "tqdm",
    "huggingface_hub",
]
vllm = ["vllm"]

[tool.setuptools.packages.find]
include = ["model_beliefs*", "latent_beliefs*", "second_order*"]
