[project]
name = "model_beliefs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "numpy",
    "scipy",
    "peft",
]

[project.optional-dependencies]
# second_order/ and the latent_beliefs replication package (pinned versions: environment.yml)
second-order = [
    "pandas",
    "pyyaml",
    "pyarrow",
    "scikit-learn",
    "matplotlib",
    "xgboost",
    "requests",
]
vllm = ["vllm"]

[tool.setuptools.packages.find]
include = ["model_beliefs*", "latent_beliefs*", "second_order*"]
